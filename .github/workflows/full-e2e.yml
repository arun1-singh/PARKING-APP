name: Full End-to-End Tests

on:
  push:
    branches: [ main, feature/reactapp-integration ]
  pull_request:
    branches: [ main, feature/reactapp-integration ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - integration

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'
  BACKEND_DIR: 'Backend'
  FRONTEND_DIR: 'admin_react_app'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 – Backend Tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: >
      !github.event.inputs.test_type ||
      github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'backend' ||
      github.event.inputs.test_type == 'integration'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_parking_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('Backend/app/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install Python dependencies
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pytest pytest-html pytest-cov pytest-flask coverage flake8

    - name: Create test environment file
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        cat > .env.test << 'EOF'
        DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY=test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY=test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY=test-rpi-key-for-ci
        FLASK_ENV=testing
        TESTING=True
        EOF

    - name: Create test-results directory
      working-directory: ${{ env.BACKEND_DIR }}
      run: mkdir -p test-results

    - name: Run database migrations
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        python -c "
        from app import create_app, db
        app = create_app('testing')
        with app.app_context():
            db.drop_all()
            db.create_all()
            print('Database tables created successfully')
        "

    - name: Run unit tests with coverage
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        python -m pytest \
          tests/test_auth.py tests/test_parking.py tests/test_admin_api.py tests/test_config.py \
          -v --tb=short \
          --junitxml=test-results/unit-tests.xml \
          --html=test-results/unit-tests.html \
          --self-contained-html \
          --cov=app \
          --cov-report=html:test-results/coverage \
          --cov-report=xml:test-results/coverage.xml

    - name: Run integration tests
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        python -m pytest \
          tests/test_integration.py \
          -v --tb=short \
          --junitxml=test-results/integration-tests.xml \
          --html=test-results/integration-tests.html \
          --self-contained-html

    - name: Run security tests
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        python -m pytest \
          tests/test_security.py tests/test_security_comprehensive.py \
          -v --tb=short \
          --junitxml=test-results/security-tests.xml \
          --html=test-results/security-tests.html \
          --self-contained-html

    - name: Run comprehensive tests
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        python -m pytest \
          tests/test_database_constraints.py tests/test_edge_cases.py \
          tests/test_concurrency.py tests/test_error_recovery.py \
          -v --tb=short \
          --junitxml=test-results/comprehensive-tests.xml \
          --html=test-results/comprehensive-tests.html \
          --self-contained-html \
          || echo "Some comprehensive tests completed with failures"

    - name: Run linting
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        flake8 app/ tests/ --max-line-length=120 --ignore=E203,W503,E501 \
          || echo "Linting completed with warnings"

    - name: Upload backend test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: ${{ env.BACKEND_DIR }}/test-results/
        retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 – Frontend Tests
# ─────────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: >
      !github.event.inputs.test_type ||
      github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'frontend' ||
      github.event.inputs.test_type == 'integration'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

    - name: Install dependencies
      working-directory: ${{ env.FRONTEND_DIR }}
      run: npm ci

    - name: Run linting
      working-directory: ${{ env.FRONTEND_DIR }}
      run: |
        npm run lint -- --quiet --ignore-pattern "mock-server/**" \
          || echo "Linting completed with warnings"

    - name: Build application
      working-directory: ${{ env.FRONTEND_DIR }}
      run: npm run build

    - name: Install Playwright browsers
      working-directory: ${{ env.FRONTEND_DIR }}
      run: npx playwright install --with-deps chromium

    - name: Start frontend dev server
      working-directory: ${{ env.FRONTEND_DIR }}
      run: |
        npm run dev > frontend.log 2>&1 &
        echo $! > frontend.pid
        # Wait until the server is actually serving
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5173/ > /dev/null 2>&1; then
            echo "✅ Frontend server ready"
            break
          fi
          echo "⏳ Waiting for frontend server ($i/30)..."
          sleep 2
        done

    - name: Run Playwright tests
      working-directory: ${{ env.FRONTEND_DIR }}
      env:
        CI: true
      run: |
        npx playwright test \
          --config=playwright.config.ci.js \
          --reporter=html,list \
          --project=chromium \
          --retries=2 \
          --timeout=180000 \
          --max-failures=10 \
          || echo "Some Playwright tests failed - continuing"

    - name: Stop frontend server
      if: always()
      working-directory: ${{ env.FRONTEND_DIR }}
      run: |
        [ -f frontend.pid ] && kill $(cat frontend.pid) 2>/dev/null || true

    - name: Upload frontend test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: |
          ${{ env.FRONTEND_DIR }}/playwright-report/
          ${{ env.FRONTEND_DIR }}/test-results/
        retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 – End-to-End Integration Tests
# (backend + frontend running together)
# ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: >
      always() &&
      (
        !github.event.inputs.test_type ||
        github.event.inputs.test_type == 'all' ||
        github.event.inputs.test_type == 'integration'
      )

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_parking_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

    - name: Install backend dependencies
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt

    - name: Install frontend dependencies
      working-directory: ${{ env.FRONTEND_DIR }}
      run: npm ci

    - name: Install Playwright browsers
      working-directory: ${{ env.FRONTEND_DIR }}
      run: npx playwright install --with-deps chromium

    - name: Setup test database
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        python -c "
        from app import create_app, db
        app = create_app('testing')
        with app.app_context():
            db.drop_all()
            db.create_all()
            print('Test database setup completed')
        "

    - name: Start backend server
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 \
          --chdir app wsgi:app > backend.log 2>&1 &
        echo $! > backend.pid
        # Wait for backend to be ready
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
            echo "✅ Backend ready"
            break
          fi
          echo "⏳ Waiting for backend ($i/30)..."
          sleep 3
        done

    - name: Start frontend server
      working-directory: ${{ env.FRONTEND_DIR }}
      run: |
        npm run dev > frontend.log 2>&1 &
        echo $! > frontend.pid
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5173/ > /dev/null 2>&1; then
            echo "✅ Frontend ready"
            break
          fi
          echo "⏳ Waiting for frontend ($i/30)..."
          sleep 2
        done

    - name: Run E2E integration tests
      working-directory: ${{ env.FRONTEND_DIR }}
      env:
        CI: true
      run: |
        mkdir -p ../test-results/e2e
        npx playwright test \
          --config=playwright.config.ci.js \
          --reporter=html,list \
          --project=chromium \
          --retries=2 \
          --timeout=180000 \
          --max-failures=10 \
          || echo "Some E2E tests failed - continuing"

    - name: Stop servers
      if: always()
      run: |
        [ -f ${{ env.BACKEND_DIR }}/backend.pid ]  && kill $(cat ${{ env.BACKEND_DIR }}/backend.pid)  2>/dev/null || true
        [ -f ${{ env.FRONTEND_DIR }}/frontend.pid ] && kill $(cat ${{ env.FRONTEND_DIR }}/frontend.pid) 2>/dev/null || true

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          ${{ env.FRONTEND_DIR }}/playwright-report/
          ${{ env.BACKEND_DIR }}/backend.log
          ${{ env.FRONTEND_DIR }}/frontend.log
        retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 – Docker Integration Tests
# (only backend — frontend has no Dockerfile yet)
# ─────────────────────────────────────────────────────────────────────────────
  docker-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    if: >
      !github.event.inputs.test_type ||
      github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'integration'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        docker build --tag parking-backend:test .

    - name: Start full stack with docker compose
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        docker compose up -d
        # Wait for backend health
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
            echo "✅ Backend container healthy"
            break
          fi
          echo "⏳ Waiting for backend container ($i/30)..."
          sleep 5
        done

    - name: Verify backend responds correctly
      run: |
        curl -sf http://localhost:5000/health
        echo "Backend health check passed"

    - name: Stop docker compose
      if: always()
      working-directory: ${{ env.BACKEND_DIR }}
      run: docker compose down -v

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 – Performance Tests
# ─────────────────────────────────────────────────────────────────────────────
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: >
      !github.event.inputs.test_type ||
      github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'integration'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_parking_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt locust

    - name: Setup database
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        python -c "
        from app import create_app, db
        app = create_app('testing')
        with app.app_context():
            db.drop_all()
            db.create_all()
            print('Database ready')
        "

    - name: Start backend for load test
      working-directory: ${{ env.BACKEND_DIR }}
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_parking_db
        SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
        JWT_SECRET_KEY: test-jwt-secret-for-ci-${{ github.run_id }}
        RPI_API_KEY: test-rpi-key-for-ci
      run: |
        gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 \
          --chdir app wsgi:app > perf.log 2>&1 &
        echo $! > app.pid
        # Wait for server to be ready
        for i in $(seq 1 20); do
          if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
            echo "✅ Backend ready for load test"
            break
          fi
          sleep 3
        done

    - name: Create test-results directory
      working-directory: ${{ env.BACKEND_DIR }}
      run: mkdir -p test-results

    - name: Run load tests
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        locust \
          -f tests/load_tests/load_test.py \
          --headless \
          --users 20 \
          --spawn-rate 5 \
          --run-time 60s \
          --host http://localhost:5000 \
          --html=test-results/load-test.html \
          --csv=test-results/load-test \
          || echo "Load test completed"

    - name: Stop backend
      if: always()
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        [ -f app.pid ] && kill $(cat app.pid) 2>/dev/null || true

    - name: Upload performance test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: ${{ env.BACKEND_DIR }}/test-results/
        retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# JOB 6 – Test Summary
# ─────────────────────────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, docker-tests, performance-tests]
    if: always()

    steps:
    - name: Generate test summary
      run: |
        echo "# 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        BACKEND="${{ needs.backend-tests.result }}"
        FRONTEND="${{ needs.frontend-tests.result }}"
        E2E="${{ needs.e2e-tests.result }}"
        DOCKER="${{ needs.docker-tests.result }}"
        PERF="${{ needs.performance-tests.result }}"

        status_icon() { [ "$1" == "success" ] && echo "✅" || echo "❌"; }

        echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Tests       | $(status_icon $BACKEND)  $BACKEND  |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend Tests      | $(status_icon $FRONTEND) $FRONTEND |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Integration     | $(status_icon $E2E)      $E2E      |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Tests        | $(status_icon $DOCKER)   $DOCKER   |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance Tests   | $(status_icon $PERF)     $PERF     |" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Detailed reports are available in the workflow artifacts." >> $GITHUB_STEP_SUMMARY
