name: Android E2E Tests with Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android/sdk
      API_LEVEL: 28
      EMULATOR_NAME: test-emulator
      PYTHON_VERSION: '3.12'
      JAVA_VERSION: 17
      APPIUM_LOG_FILE: appium.log
      TEST_REPORT_FILE: tests/report.html
      APP_PACKAGE: com.example.visionpark

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Vision-Parking/tests/requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools system-images;android-${{ env.API_LEVEL }};google_apis;x86_64 build-tools;28.0.3
          android-sdk-path: ${{ env.ANDROID_SDK_ROOT }}

      - name: Cache Android AVD
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
            ~/.android/avd/*.ini
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64

      - name: Clean up Docker Compose
        run: docker compose down -v
        working-directory: ./Backend
        if: always()

      - name: Start backend with Docker Compose
        run: docker compose up -d
        working-directory: ./Backend

      - name: Wait for database to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U parking_user -d parking_db; then break; fi
            sleep 5
          done
        working-directory: ./Backend

      - name: Setup database with seeding file
        run: |
          docker cp COMPLETE_DATABASE_SETUP_FIXED.sql $(docker compose ps -q db):/setup.sql
          docker compose exec -T db psql -U parking_user -d parking_db -f /setup.sql
        working-directory: ./Backend

      - name: Wait for backend API to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:5000/health; then exit 0; fi
            sleep 5
          done
          echo "Backend API did not start in time"
          docker compose logs
          exit 1
        working-directory: ./Backend

      - name: Verify database setup
        run: |
          echo "Verifying database tables and data..."
          docker compose exec -T db psql -U parking_user -d parking_db -c "
            SELECT 
              (SELECT COUNT(*) FROM users) as users,
              (SELECT COUNT(*) FROM parkinglots_details) as parking_lots,
              (SELECT COUNT(*) FROM user_vehicles) as vehicles,
              (SELECT COUNT(*) FROM parking_sessions) as sessions;
          "
        working-directory: ./Backend

      - name: Inject Google Maps API Key
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > Vision-Parking/local.properties

      - name: Make gradlew executable
        run: chmod +x Vision-Parking/gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug
        working-directory: ./Vision-Parking

      - name: Make run_e2e.sh executable
        run: chmod +x Vision-Parking/run_e2e.sh

      - name: Run E2E tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -memory 4096 -wipe-data -partition-size 8192 -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            echo "=== Step 1: Wait for device ==="
            adb wait-for-device

            echo "=== Step 2: Wait for boot ==="
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            echo "✅ Boot completed"

            echo "=== Step 3: Wait for package manager to be truly stable ==="
            for i in $(seq 1 90); do
              if adb shell pm list packages > /dev/null 2>&1; then
                echo "✅ Package manager stable after ${i}s"
                break
              fi
              sleep 2
            done

            echo "=== Step 4: Extra stabilization wait (20s) ==="
            sleep 20

            echo "=== Step 5: Dismiss system dialogs ==="
            adb shell input keyevent KEYCODE_BACK  2>/dev/null || true
            sleep 1
            adb shell input keyevent KEYCODE_ENTER 2>/dev/null || true
            sleep 1

            echo "=== Step 6: Install APK with retry ==="
            INSTALL_SUCCESS=0
            for attempt in $(seq 1 5); do
              echo "Install attempt $attempt/5..."
              if ! adb shell pm list packages > /dev/null 2>&1; then
                echo "Package manager not ready, waiting 30s..."
                sleep 30
                continue
              fi
              if adb install -r Vision-Parking/app/build/outputs/apk/debug/app-debug.apk 2>&1; then
                INSTALL_SUCCESS=1
                echo "✅ APK installed on attempt $attempt"
                break
              else
                echo "❌ Install failed on attempt $attempt, waiting 30s..."
                sleep 30
              fi
            done
            if [ $INSTALL_SUCCESS -ne 1 ]; then
              echo "❌ APK install failed after 5 attempts"
              adb devices
              exit 1
            fi

            echo "=== Step 7: Verify installation ==="
            adb shell pm list packages | grep $APP_PACKAGE || { echo "❌ App not found after install"; exit 1; }

            echo "=== Step 8: Grant permissions ==="
            adb shell pm grant $APP_PACKAGE android.permission.CAMERA || true
            adb shell pm grant $APP_PACKAGE android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant $APP_PACKAGE android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant $APP_PACKAGE android.permission.WRITE_EXTERNAL_STORAGE || true
            adb shell pm grant $APP_PACKAGE android.permission.READ_EXTERNAL_STORAGE || true

            echo "=== Step 9: Clear app data ==="
            adb shell pm clear $APP_PACKAGE || echo "Could not clear app data"

            echo "=== Step 10: Launch and verify app ==="
            adb shell am start -n $APP_PACKAGE/com.example.visionpark.activities.SplashScreenActivity
            sleep 8
            adb shell "ps -A 2>/dev/null | grep $APP_PACKAGE" || adb shell "ps 2>/dev/null | grep $APP_PACKAGE" || echo "App process not found (may be normal)"
            adb shell dumpsys activity activities | grep "mResumedActivity" || echo "Could not get current activity"

            echo "=== Step 11: Stop app before tests ==="
            adb shell am force-stop $APP_PACKAGE
            sleep 2

            echo "=== Step 12: Run E2E tests ==="
            cd Vision-Parking && timeout 25m ./run_e2e.sh

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: Vision-Parking/${{ env.TEST_REPORT_FILE }}
        if: always()

      - name: Upload Appium log
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: ${{ env.APPIUM_LOG_FILE }}
        if: always()

      - name: Clean up Docker Compose
        run: docker compose down -v
        working-directory: ./Backend
        if: always()